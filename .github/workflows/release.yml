name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke-test packaged app
        shell: pwsh
        run: |
          $env:MOI_DATA_DIR = Join-Path $env:RUNNER_TEMP 'moi-smoke'
          $env:MOI_PORT = '38479'
          $app = Start-Process '.\dist\MoviesOfInterest.exe' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-RestMethod 'http://127.0.0.1:38479/api/health'
                if ($response.app -eq 'Movies of Interest') { $ready = $true; break }
              } catch { if ($app.HasExited) { throw 'Packaged app exited unexpectedly' } }
            }
            if (-not $ready) { throw 'Packaged app did not become ready' }
            & '.\dist\MoviesOfInterest.exe' --stop
            if ($LASTEXITCODE -ne 0) { throw 'Shutdown failed' }
            if (-not $app.WaitForExit(10000)) { throw 'Server did not stop' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MoviesOfInterest-Windows-x64
          path: |
            dist/MoviesOfInterest-Setup-*.exe
            dist/SHA256SUMS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MoviesOfInterest-Windows-x64
          path: release
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --title "Movies of Interest $TAG" --generate-notes
